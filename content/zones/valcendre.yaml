# Peuplement de la zone Valcendre. Coordonnées en tuiles (carte 128 × 128).
# Chaque groupe fait apparaître `count` zombies sur des tuiles libres tirées dans le rectangle
# [x0, x1] × [y0, y1] (tirage déterministe, graine `seed`). Un zombie tué réapparaît au même point
# d'origine après `respawn_s` secondes, si aucun joueur n'est à moins de `respawn_min_player_distance`.
# Le point d'apparition des joueurs (place du village, vers 58–65 × 50–57) est laissé libre.

seed: 4242
respawn_s: 180
respawn_min_player_distance: 20

zombie_groups:
  - {type: rodeur, count: 6, x0: 96, x1: 124, y0: 60, y1: 66}    # route de l'est
  - {type: rodeur, count: 5, x0: 30, x1: 54, y0: 60, y1: 66}     # route de l'ouest
  - {type: rodeur, count: 6, x0: 15, x1: 32, y0: 95, y1: 112}    # parking abandonné
  - {type: rodeur, count: 5, x0: 76, x1: 98, y0: 86, y1: 99}     # autour de l'école
  - {type: rodeur, count: 4, x0: 44, x1: 62, y0: 86, y1: 99}     # coopérative
  - {type: rodeur, count: 4, x0: 62, x1: 80, y0: 16, y1: 24}     # terrain vague du nord
  - {type: rodeur, count: 5, x0: 10, x1: 40, y0: 10, y1: 40}     # forêt
  - {type: rodeur, count: 4, x0: 69, x1: 74, y0: 100, y1: 124}   # route du sud
  - {type: rodeur, count: 3, x0: 76, x1: 100, y0: 70, y1: 80}    # rue des maisons jumelles

# Objets du jeu : armes, munitions, nourriture, boissons, soins.
# Lu par le serveur au démarrage (validation stricte : server/app/content/). Aucune logique ici.
#
# Champs communs :
#   name    nom affiché (≤ 32 caractères)
#   kind    melee | firearm | ammo | food | drink | medical
#   weight  poids d'une unité, en kg
#   stack   taille maximale d'une pile (1 = non empilable)
#
# Armes de mêlée (`melee`) : damage (PV par coup), range (tuiles, depuis le centre du joueur),
#   arc_deg (ouverture du coup), cooldown_s, durability (coups avant de casser), noise (rayon en tuiles).
# Armes à feu (`firearm`) : damage (par projectile), pellets (projectiles par tir), range, spread_deg
#   (dispersion totale), cooldown_s, magazine, ammo (objet consommé), reload_s, durability (tirs), noise.
# Consommables (`consume`) : hunger, thirst, health (points rendus), stops_bleeding.

